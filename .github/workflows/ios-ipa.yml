name: iOS IPA

# İmzasız IPA üretir — jailbreakli cihaza (TrollStore / AppSync Unified)
# doğrudan kurulabilir. Apple Developer hesabı GEREKTİRMEZ.
#
# ⚠️ İmzasız derlemede PUSH BİLDİRİMİ ÇALIŞMAZ. APNs kaydı, Apple'ın
# verdiği `aps-environment` yetkisini taşıyan geçerli bir provisioning
# profile ister; imzalama kapatıldığında bu yetki de düşer. Uygulamanın
# geri kalanı (giriş, sözleşme, sohbet, uygulama AÇIKKEN gelen aramalar —
# bunlar soket üzerinden gelir) sorunsuz çalışır.
# Push'u uçtan uca denemek için `docs/BUILD.md` içindeki EAS yolunu kullan.

# ── Nasıl çalıştırılır ──────────────────────────────────────────────
#
# `workflow_dispatch` (Actions sekmesindeki "Run workflow" düğmesi) YALNIZCA
# bu dosya VARSAYILAN DALDA (`main`) olduğunda görünür. GitHub'ın kuralı bu;
# dosya bir özellik dalındayken Actions sekmesinde hiçbir şey çıkmaz.
#
# Bu yüzden bir de ETİKET tetikleyicisi var: `push` olayında GitHub, itilen
# ref'teki iş akışı dosyalarını okur — yani varsayılan dalda olmasına gerek
# kalmaz. Dal birleşmeden önce derleme almanın yolu:
#
#     git tag ipa-1
#     git push origin ipa-1
#
# Sonraki derlemeler için sayıyı artır (ipa-2, ipa-3…).
#
# ⚠️ Bu depo ÖZEL ve macOS koşucuları özel depolarda dakika başına 10 KAT
# sayılır. Bir iOS derlemesi ~30-45 dk sürer, yani ~300-450 faturalanabilir
# dakika. Aylık kotanı hızla yer — bu yüzden her push'ta değil, bilerek
# etiket atınca çalışıyor.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "EXPO_PUBLIC_API_URL (boşsa .env.production kullanılır)"
        required: false
        default: ""
  push:
    tags:
      - "ipa-*"

jobs:
  build:
    # iOS derlemesi yalnızca macOS'ta mümkün: Xcode başka bir platformda yok.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26 seç
        # `macos-15` imajının VARSAYILAN Xcode'u 16.4 ve o da Swift 6.1 ile
        # geliyor. Expo SDK 57'nin `expo-modules-jsi` paketi ise kendi SwiftPM
        # manifestinde (`node_modules/expo-modules-jsi/apple/Package.swift`)
        # `swift-tools-version: 6.2` istiyor. Bu paketi CocoaPods'un
        # "Build ExpoModulesJSI xcframework" betiği iç içe bir xcodebuild ile
        # derlediği için derleme şurada patlıyordu:
        #
        #   xcodebuild: error: Could not resolve package dependencies:
        #     package 'apple' is using Swift tools version 6.2.0
        #     but the installed version is 6.1.0
        #
        # Xcode 26 imajda zaten KURULU, sadece seçili değil — seçmek yetiyor,
        # runner'ı değiştirmeye gerek yok. `xcode-select` global olduğu için
        # sonraki tüm adımlar (prebuild, pod install, xcodebuild) aynı
        # araç zincirini kullanır; bu yüzden adım en başta duruyor.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "Xcode 26 bulunamadı. İmajdaki sürümler:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Ortam değişkenleri
        if: inputs.api_url != ''
        run: echo "EXPO_PUBLIC_API_URL=${{ inputs.api_url }}" >> "$GITHUB_ENV"

      - name: Native projeyi üret
        # `--clean`: depoda ios/ dizini tutulmuyor (managed workflow), her
        # derleme app.json'dan sıfırdan üretiliyor. Böylece eklenti
        # değişiklikleri (bildirim sesi, arka plan modları) mutlaka uygulanır.
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Şemayı bul
        id: scheme
        working-directory: ios
        # Şema adı app.json'daki `name`den türüyor; sabit yazmak yerine
        # projeden okumak, uygulama adı değiştiğinde derlemeyi kırmaz.
        run: |
          workspace=$(ls -d *.xcworkspace | head -n1)
          scheme=$(xcodebuild -workspace "$workspace" -list -json | node -e "
            let raw='';process.stdin.on('data',c=>raw+=c).on('end',()=>{
              const {workspace}=JSON.parse(raw);
              console.log(workspace.schemes.find(s=>!s.startsWith('Pods'))??workspace.schemes[0]);
            });")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Workspace: $workspace / Şema: $scheme"

      - name: Derle (imzasız)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: IPA paketle
        working-directory: ios
        # IPA, içinde `Payload/<Uygulama>.app` olan bir zip'ten ibarettir.
        # Xcode'un `-exportArchive` adımı imza ister; imzasız derlemede
        # paketi elle kurmak tek yol.
        run: |
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          echo "Uygulama: $app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry ciklet-unsigned.ipa Payload
          ls -lh ciklet-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ciklet-ios-unsigned-ipa
          path: ios/ciklet-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
