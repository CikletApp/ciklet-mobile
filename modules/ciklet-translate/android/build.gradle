plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ciklet'
version = '1.0.0'

android {
  namespace "expo.modules.ciklettranslate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ML Kit (Apache 2.0): çeviri modelleri cihaza iner, çeviri ve dil
  // algılama tamamen cihazda.
  implementation 'com.google.mlkit:translate:17.0.3'
  implementation 'com.google.mlkit:language-id:17.0.6'
}
